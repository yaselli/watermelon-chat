<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:"><title>共读室</title>
<style>
:root{color-scheme:light dark;--paper:#faf7ef;--ink:#33372e;--leaf:#375941;--card:#edeedc;--line:#ced1be}*{box-sizing:border-box}body{margin:auto;max-width:720px;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,sans-serif;padding:20px}h1,h2,article{font-family:serif}h1{font-size:36px;margin:24px 0}button,select,textarea,label.action{font:inherit;color:inherit;border:1px solid var(--line);background:transparent;border-radius:12px;padding:7px 12px}button,label.action{cursor:pointer}button.primary,.action{background:var(--leaf)!important;color:var(--paper)!important}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.book{display:flex;width:100%;align-items:center;text-align:left;gap:14px;margin:12px 0;padding:16px;background:var(--card)}.book img{width:44px;height:62px;object-fit:cover}small{display:block;opacity:.75}article{font-size:1.23rem;line-height:1.95;white-space:pre-wrap}mark{background:#e7d790;color:#342d1c;border-radius:3px}textarea{width:100%}dialog{width:min(92%,530px);max-height:85vh;overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px}blockquote{border-left:3px solid var(--leaf);margin:12px 0;padding-left:12px}.note{padding:10px;background:var(--card);margin:8px 0;border-radius:10px}#status{color:var(--leaf)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--paper:#222820;--ink:#ebe9dc;--leaf:#b2cfac;--card:#323b30;--line:#55604e}}
</style><main id="shelf"><h1>共读室</h1><label class="action">导入一本书<input type="file" id="file" accept=".epub,.txt" hidden></label><div id="library"></div></main>
<main id="reader" hidden><button id="back">‹ 书架</button><h2 id="title"></h2><div class="bar"><select id="toc" aria-label="章节"></select><select id="roles" aria-label="共读角色"></select><button id="font">字号</button></div><label><input id="auto" type="checkbox"> 翻页时邀请 TA 留言</label><article id="passage"></article><div class="bar"><button id="prev">上一页</button><span id="position"></span><button id="next">下一页</button></div><button class="primary" id="discuss">划线 / 一起读</button><div id="threads"></div></main><p id="status" role="status"></p>
<dialog id="sheet"><button id="close">关闭</button><blockquote id="quote"></blockquote><div id="history"></div><textarea id="draft" placeholder="写下你的想法…" rows="3"></textarea><div class="bar"><button id="save">保存批注</button><button class="primary" id="ask">邀请 TA 回应</button></div></dialog><script src="jszip.min.js"></script><script src="reader.js"></script></html>
